# 100 Hz guarded bring-up. Controller command timeout is 0.2 s after the final trajectory point.
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    left_forward_position_controller:
      type: forward_command_controller/ForwardCommandController
    left_forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController
    left_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_forward_position_controller:
      type: forward_command_controller/ForwardCommandController
    right_forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController
    right_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    enforce_command_limits: true
left_forward_position_controller:
  ros__parameters:
    joints:
    - openarm_left_joint1
    - openarm_left_joint2
    - openarm_left_joint3
    - openarm_left_joint4
    - openarm_left_joint5
    - openarm_left_joint6
    - openarm_left_joint7
    interface_name: position
    command_interfaces:
    - position
    state_interfaces:
    - position
left_forward_velocity_controller:
  ros__parameters:
    joints:
    - openarm_left_joint1
    - openarm_left_joint2
    - openarm_left_joint3
    - openarm_left_joint4
    - openarm_left_joint5
    - openarm_left_joint6
    - openarm_left_joint7
    interface_name: velocity
    command_interfaces:
    - velocity
    state_interfaces:
    - velocity
left_joint_trajectory_controller:
  ros__parameters:
    joints:
    - openarm_left_joint1
    - openarm_left_joint2
    - openarm_left_joint3
    - openarm_left_joint4
    - openarm_left_joint5
    - openarm_left_joint6
    - openarm_left_joint7
    interface_name: position
    command_interfaces:
    - position
    state_interfaces:
    - position
    interpolation_method: splines
    interpolate_from_desired_state: true
    state_publish_rate: 50.0
    action_monitor_rate: 50.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
      decelerate_on_cancel: false
      openarm_left_joint1:
        trajectory: 0.0
        goal: 0.0
      openarm_left_joint2:
        trajectory: 0.0
        goal: 0.0
      openarm_left_joint3:
        trajectory: 0.0
        goal: 0.0
      openarm_left_joint4:
        trajectory: 0.0
        goal: 0.0
      openarm_left_joint5:
        trajectory: 0.0
        goal: 0.0
      openarm_left_joint6:
        trajectory: 0.0
        goal: 0.0
      openarm_left_joint7:
        trajectory: 0.0
        goal: 0.0
    cmd_timeout: 0.2
left_gripper_controller:
  ros__parameters:
    joints:
    - openarm_left_finger_joint1
    command_interfaces:
    - position
    state_interfaces:
    - position
    interpolation_method: splines
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
    interpolate_from_desired_state: true
    cmd_timeout: 0.2
