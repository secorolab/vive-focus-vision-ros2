#
# Every topic name, frame, rate and address the VR components use. Nothing here is baked into
# the binaries; the launch file passes this file through, and any value can be overridden on the
# command line with -p, or by pointing the launch at a different config with params_file:=.

/**:
  ros__parameters:
    # Namespaces both components agree on. The headset publishes into raw_ns; InputNode consumes
    # that and republishes calibrated poses into out_ns. They must differ, or InputNode would
    # subscribe to its own output.
    raw_ns: /vive_vr/raw
    out_ns: /vive_vr

    # The beacon the client's ClockSync estimates its offset against. InputNode publishes it, so
    # tracking alone is still stamped on PC time; the parameter is shared because the topic name
    # is part of the contract with the client either way.
    pc_time_topic: /vive_vr/pc_time
    pc_time_rate_hz: 10.0

vive_scene:
  ros__parameters:
    # model and scene_url have no sensible default: the launch file supplies them.
    manifest: ""
    frame_id: world
    rate_hz: 60.0

vive_input:
  ros__parameters:
    world_frame: world
    origin_frame: vr_origin

    # Play-space calibration: where the headset's guardian origin sits in the world frame.
    # Identity until something measures it; until then the headset and the robot are only
    # coincidentally in the same place.
    origin_xyz: [0.0, 0.0, 0.0]
    origin_rpy: [0.0, 0.0, 0.0]

    # VIVE controllers keep reporting a tracked pose while lying on a table. A controller that
    # has not moved this far within this long is reported inactive on <out_ns>/<hand>/active.
    motion_eps_m: 0.003
    stale_after_s: 1.0

    hands: [left, right]
    # Published in the world frame but carrying no button state, so it is not in `hands`.
    head_name: head

    # What of the client's stream is republished into out_ns. These drop the republish only: the
    # headset still sends what it sends, so turning one off saves ROS traffic, not Wi-Fi.
    publish_hand_joints: true
    publish_gaze: true

    # 26 joints per hand become 26 TF frames per hand, parented as a real hand skeleton. Turn
    # this off if the TF tree matters more than the hands do: at 60 Hz it is 3120 transforms a
    # second, which every tf2 listener in the system pays for.
    publish_hand_tf: true

vive_teleop:
  ros__parameters:
    # A clutch held perfectly still must stay closed, so a dropout is measured as the absence of
    # pose messages. <hand>/active means "has not moved" and would open the clutch on anyone
    # holding a position.
    teleop.pose_timeout_s: 0.25

    # One block per arm; the arm names are whatever appears here. Nothing counts arms, so a
    # second block is all a dual-arm setup needs.
    teleop:
      right:
        hand: right
        # The grip button: the hand holds the pose the way it holds the controller. The
        # simulated grabber moved to the thumbstick click to make room for it.
        clutch_button: 1
        # The trigger's analog pull, axes[2], published as 0 open to 1 closed while the clutch
        # is held. Set to -1 to fall back to the trigger's button.
        gripper_axis: 2
        ee_pose_topic: ""
        # Controller axes onto tool axes, degrees. Identity is wrong for any real gripper -
        # OpenXR's grip pose puts -Z toward the thumb and a tool frame puts +Z along the
        # approach - but the right value is the one observed, not the one the conventions imply.
        tool_from_controller_rpy: [0.0, 0.0, 0.0]
