name: kitchen
description: >
  RoboCasa kitchen, around 190 bodies, with graspable objects added where its counters have
  room, because every fixture in one is welded. The world the pose stream was measured against.
generator: scripts/make_kitchen.py
args: [--env, NavigateKitchen, --layout, "1", --style, "1"]
# Needs RoboCasa and its asset packs; see docs/install.md.
heavy: true
# RoboCasa draws fixtures in group 1 and puts collision boxes in group 0, and those boxes are
# opaque dark red: exporting them buries the kitchen inside a red shell.
groups: "1"
# Standing back from the counter run along y = -0.33, facing it.
spawn:
  xyz: [2.4, -2.4, 0.0]
  yaw_deg: 90.0
