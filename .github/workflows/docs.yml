name: docs

# Deploys from dev as well as main for now, so the published site tracks work in progress.
# Both branches publish to the same Pages site: whichever runs last wins.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should replace an older one rather than race it; an in-flight deploy is left
# to finish so the site is never served half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Not apt: runners ship Doxygen 1.9.x, whose own stylesheet overrides the theme's code
      # block padding and navigation tree styling. The theme is written against 1.16.
      - name: Install doxygen ${{ env.DOXYGEN_VERSION }}
        env:
          DOXYGEN_VERSION: 1.16.1
        run: |
          url="https://github.com/doxygen/doxygen/releases/download"
          curl -fsSL -o /tmp/doxygen.tar.gz \
            "$url/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          mkdir -p /tmp/doxygen && tar -xzf /tmp/doxygen.tar.gz -C /tmp/doxygen
          echo "DOXYGEN=/tmp/doxygen/doxygen-${DOXYGEN_VERSION}/bin/doxygen" >> "$GITHUB_ENV"

      # Deliberately not the CMake docs target: that needs ROS 2, MuJoCo and the KDL fork
      # configured first. This runs the same Doxyfile.in and fails on any doxygen warning.
      - name: Build documentation
        run: ./tools/build_docs.sh "${{ github.workspace }}/build/docs"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/docs/html

  deploy:
    # Pull requests build the docs as a check but must not publish them.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
